<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>컬러 타일 천후개조</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    .hidden { display: none !important; }

    /* --- 로비 화면 --- */
    .lobby-card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6);
      text-align: center;
    }

    .lobby-card h1 { color: #58a6ff; font-size: 26px; margin-bottom: 25px; }

    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label {
      display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #8b949e;
    }
    .form-group input[type="text"], .form-group select {
      width: 100%; padding: 12px; background-color: #21262d; color: #f0f6fc;
      border: 1px solid #30363d; border-radius: 8px; font-size: 15px; outline: none;
    }
    .form-group input[type="text"]:focus, .form-group select:focus { border-color: #58a6ff; }

    .checkbox-group {
      display: flex; align-items: center; justify-content: space-between;
      background-color: #21262d; padding: 12px 15px; border-radius: 8px;
      border: 1px solid #30363d; cursor: pointer;
    }
    .checkbox-group label { margin-bottom: 0; cursor: pointer; color: #c9d1d9; }
    .checkbox-group input[type="checkbox"] {
      width: 18px; height: 18px; accent-color: #58a6ff; cursor: pointer;
    }

    .btn-start {
      width: 100%; padding: 14px; font-size: 17px; font-weight: bold;
      background: #238636; color: white; border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3); transition: filter 0.2s;
    }
    .btn-start:hover { filter: brightness(1.15); }

    /* --- 게임 메인 레이아웃 --- */
    .game-container {
      display: flex; gap: 20px; align-items: flex-start; justify-content: center;
      max-width: 1650px; width: 100%;
    }

    .sidebar {
      width: 220px; background-color: #161b22; border: 1px solid #30363d;
      border-radius: 14px; padding: 16px; flex-shrink: 0;
    }

    .sidebar h3 {
      font-size: 16px; color: #58a6ff; margin-bottom: 15px;
      padding-bottom: 10px; border-bottom: 1px solid #30363d;
    }

    .player-list-container { display: flex; flex-direction: column; gap: 10px; }

    .player-card {
      background-color: #21262d; border: 1px solid #30363d;
      border-radius: 8px; padding: 10px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .player-card.my-card { border-color: #58a6ff; background-color: #1f293e; }

    .player-info { display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .rank-badge {
      font-size: 11px; font-weight: bold; background-color: #30363d;
      color: #8b949e; padding: 2px 6px; border-radius: 4px;
    }
    .nickname {
      font-size: 14px; font-weight: 600; color: #c9d1d9;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px;
    }
    .me-tag { font-size: 11px; color: #58a6ff; }
    .score-text { font-size: 14px; font-weight: bold; color: #d29922; }

    .main-section { display: flex; flex-direction: column; align-items: flex-end; }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; margin-bottom: 10px; gap: 10px;
    }

    .left-tools { display: flex; align-items: center; gap: 15px; }

    .time-box { font-size: 16px; font-weight: 600; color: #58a6ff; }
    .time-warning { color: #f85149; animation: blink 1s infinite; }

    .btn-hint {
      padding: 8px 16px; background-color: #21262d; color: #8b949e;
      border: 1px solid #30363d; border-radius: 6px; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn-hint.active {
      background: #d29922; color: #0d1117; border-color: #f1e05a;
      box-shadow: 0 0 10px rgba(210, 153, 34, 0.5);
      animation: pulse-hint 1.2s infinite;
    }

    @keyframes pulse-hint {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    @keyframes blink { 50% { opacity: 0.5; } }

    .btn-lobby {
      padding: 8px 16px; background-color: #21262d; color: #8b949e;
      border: 1px solid #30363d; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .btn-lobby:hover { background-color: #30363d; color: #fff; }

    .grid {
      display: grid;
      gap: 2px;
      background-color: #161b22;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid #30363d;
    }

    .tile {
      border-radius: 4px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; user-select: none;
      transition: transform 0.08s ease, filter 0.08s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .tile:hover { transform: scale(1.15); z-index: 2; filter: brightness(1.15); }

    .empty {
      background-color: #0d1117 !important; border-radius: 4px; cursor: pointer;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
    }
    .empty:hover { background-color: #1c2128 !important; }

    .empty.hint-highlight {
      background-color: #d29922 !important;
      box-shadow: 0 0 12px #d29922, inset 0 0 4px #ffffff;
      animation: hintBlink 0.5s infinite alternate;
      z-index: 5;
    }

    @keyframes hintBlink {
      from { opacity: 0.6; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1.15); }
    }

    /* 좁은 해상도(노트북 등) 전용 자동 축소 매크로 */
    @media (max-width: 1550px) {
      .tile {
        width: 20px !important;
        height: 20px !important;
        font-size: 10px !important;
      }
    }

    .toast-msg {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #d29922; color: #0d1117; font-weight: bold; padding: 10px 20px;
      border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 200;
      display: none; font-size: 14px;
    }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 17, 23, 0.85); align-items: center; justify-content: center;
      z-index: 100; backdrop-filter: blur(4px);
    }
    .modal.active { display: flex; }

    .modal-card {
      background-color: #161b22; border: 1px solid #30363d; border-radius: 14px;
      padding: 28px; width: 90%; max-width: 400px; text-align: center;
    }

    .modal-card h2 { font-size: 26px; margin-bottom: 8px; }
    .modal-card p { font-size: 14px; margin-bottom: 18px; color: #8b949e; }

    .modal-leaderboard {
      background-color: #21262d; border-radius: 8px; padding: 10px;
      margin-bottom: 20px; max-height: 200px; overflow-y: auto; text-align: left;
    }

    .modal-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; border-bottom: 1px solid #30363d; font-size: 14px;
    }
    .modal-row:last-child { border-bottom: none; }
    .modal-row.rank-1 { color: #d29922; font-weight: bold; }

    .btn-modal {
      width: 100%; padding: 12px; font-size: 15px; font-weight: bold;
      background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="toast" class="toast-msg"></div>

  <!-- 로비 화면 -->
  <div id="lobby-view" class="lobby-card">
    <h1>🎨 컬러 타일 천후개조</h1>
    
    <div class="form-group">
      <label for="nickname-input">👤 닉네임 설정</label>
      <input type="text" id="nickname-input" value="플레이어1" placeholder="닉네임 입력">
    </div>

    <div class="form-group">
      <label for="room-input">🔑 방 코드</label>
      <input type="text" id="room-input" value="ROOM_1" placeholder="예: ROOM_123">
    </div>

    <div class="form-group">
      <label for="mode-select">🎮 난이도 모드 선택</label>
      <select id="mode-select">
        <option value="normal" selected>일반 모드 (16×30 / 200점 목표)</option>
        <option value="hard">하드 모드 (25×50 / 500점 목표 /)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="color-select">🎨 색상 개수 선택</label>
      <select id="color-select">
        <option value="8">8개 (매우 쉬움)</option>
        <option value="12">12개 (쉬움)</option>
        <option value="16" selected>16개 (보통)</option>
        <option value="20">20개 (어려움)</option>
        <option value="24">24개 (매우 어려움)</option>
        <option value="32">32개 (지옥 난이도)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="time-select">⏱️ 제한 시간 설정</label>
      <select id="time-select">
        <option value="60">1분 (60초)</option>
        <option value="120">2분 (120초)</option>
        <option value="180">3분 (180초)</option>
        <option value="300">5분 (300초)</option>
        <option value="86400" selected>24시간 (무제한)</option>
      </select>
    </div>

    <div class="form-group">
      <div class="checkbox-group" onclick="document.getElementById('icon-toggle').click();">
        <label for="icon-toggle">🔢 타일 위 숫자 라벨 표시</label>
        <input type="checkbox" id="icon-toggle" checked onclick="event.stopPropagation()">
      </div>
    </div>

    <button class="btn-start" onclick="startGame()">게임 시작하기</button>
  </div>

  <!-- 게임 메인 화면 -->
  <div id="game-view" class="game-container hidden">
    <div class="sidebar">
      <h3>👥 플레이어 현황</h3>
      <div id="player-list" class="player-list-container"></div>
    </div>

    <div class="main-section">
      <div class="top-bar">
        <div class="left-tools">
          <div class="time-box">⏱️ 남은 시간: <span id="timer">--:--</span></div>
          <button id="btn-hint" class="btn-hint" onclick="useHint()">💡 힌트 (60초)</button>
        </div>
        <button class="btn-lobby" onclick="resetToLobby()">로비로 나가기</button>
      </div>

      <div id="board" class="grid"></div>
    </div>
  </div>

  <!-- 결과 모달 팝업 -->
  <div id="modal" class="modal">
    <div class="modal-card">
      <h2 id="modal-title">🏆 승리!</h2>
      <p id="modal-desc">목표 점수를 달성하셨습니다!</p>
      <div id="modal-leaderboard" class="modal-leaderboard"></div>
      <button class="btn-modal" onclick="resetToLobby()">로비로 이동</button>
    </div>
  </div>

<script>
  const socket = io();

  const SYMBOLS = Array.from({length: 32}, (_, i) => (i + 1).toString());

  let board = [];
  let timeRemaining = 0;
  let currentRoomId = "ROOM_1";
  let showIcons = true;
  let activeColors = [];
  let lastScores = {};
  
  let currentConfig = { rows: 16, cols: 30, winScore: 200 };

  let hintSeconds = 60;
  let hintTimer = null;

  function generateEyeFriendlyColors(count) {
    const colors = [];
    for (let i = 0; i < count; i++) {
      const hue = Math.floor((360 / count) * i);
      const sat = 50 + (i % 3) * 5;
      const light = 42 + (i % 2) * 12;

      const textColor = light > 52 ? '#0f172a' : '#ffffff';

      colors.push({
        background: `hsl(${hue}, ${sat}%, ${light}%)`,
        textColor: textColor
      });
    }
    return colors;
  }

  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playCorrectSound() {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }

  function playWrongSound() {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(130, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  }

  function resetHintTimer() {
    clearInterval(hintTimer);
    hintSeconds = 60;
    const btnHint = document.getElementById('btn-hint');
    btnHint.classList.remove('active');
    btnHint.innerText = `💡 힌트 (${hintSeconds}초)`;

    clearHintHighlights();

    hintTimer = setInterval(() => {
      hintSeconds--;
      if (hintSeconds <= 0) {
        clearInterval(hintTimer);
        btnHint.classList.add('active');
        btnHint.innerText = "💡 힌트 보기!";
      } else {
        btnHint.innerText = `💡 힌트 (${hintSeconds}초)`;
      }
    }, 1000);
  }

  function useHint() {
    const btnHint = document.getElementById('btn-hint');
    if (!btnHint.classList.contains('active')) {
      showToast(`⏳ 힌트는 미득점 상태로 ${hintSeconds}초 후에 활성화됩니다!`);
      return;
    }
    socket.emit('getHint', { roomId: currentRoomId });
  }

  function clearHintHighlights() {
    document.querySelectorAll('.hint-highlight').forEach(el => {
      el.classList.remove('hint-highlight');
    });
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2500);
  }

  function startGame() {
    initAudio();
    const nickname = document.getElementById('nickname-input').value.trim() || "익명";
    currentRoomId = document.getElementById('room-input').value.trim() || "ROOM_1";
    const selectedMode = document.getElementById('mode-select').value;
    const selectedColorCount = parseInt(document.getElementById('color-select').value, 10);
    const timeLimit = parseInt(document.getElementById('time-select').value, 10);
    showIcons = document.getElementById('icon-toggle').checked;

    activeColors = generateEyeFriendlyColors(selectedColorCount);

    socket.emit('joinRoom', {
      roomId: currentRoomId,
      colorCount: selectedColorCount,
      timeLimit,
      nickname,
      mode: selectedMode
    });
  }

  function resetToLobby() {
    location.reload();
  }

  socket.on('initMyBoard', ({ board: myBoard, timeRemaining: serverTime, config }) => {
    board = myBoard;
    timeRemaining = serverTime;
    currentConfig = config;

    document.getElementById('lobby-view').classList.add('hidden');
    document.getElementById('game-view').classList.remove('hidden');
    document.getElementById('modal').classList.remove('active');

    buildBoardElements();
    renderBoard();
    updateTimerDisplay();
    resetHintTimer();
  });

  socket.on('updateMyBoard', ({ board: myBoard, hit, shuffled }) => {
    board = myBoard;
    renderBoard();

    if (hit) {
      playCorrectSound();
      resetHintTimer();
    } else {
      playWrongSound();
    }

    if (shuffled) {
      showToast('🔀 매칭 가능한 수가 없어 타일 위치를 새로 섞었습니다!');
    }
  });

  socket.on('receiveHint', (hintPos) => {
    clearHintHighlights();
    if (hintPos) {
      const tile = document.getElementById(`tile-${hintPos.r}-${hintPos.c}`);
      if (tile) {
        tile.classList.add('hint-highlight');
        showToast('💡 강조된 빈칸을 클릭하세요!');
      }
    } else {
      showToast('💡 맞출 자리가 없어 맵이 곧 섞입니다.');
    }
  });

  socket.on('updateScores', ({ scores, winScore }) => {
    lastScores = scores;
    const playerListEl = document.getElementById('player-list');
    playerListEl.innerHTML = '';

    const sortedPlayers = Object.keys(scores).map(id => ({
      id,
      nickname: scores[id].nickname,
      score: scores[id].score
    })).sort((a, b) => b.score - a.score);

    sortedPlayers.forEach((player, index) => {
      const isMe = player.id === socket.id;
      const card = document.createElement('div');
      card.className = `player-card ${isMe ? 'my-card' : ''}`;
      
      card.innerHTML = `
        <div class="player-info">
          <span class="rank-badge">${index + 1}위</span>
          <span class="nickname" title="${player.nickname}">${player.nickname}</span>
          ${isMe ? '<span class="me-tag">(나)</span>' : ''}
        </div>
        <div class="score-text">${player.score} / ${winScore}</div>
      `;

      playerListEl.appendChild(card);
    });
  });

  socket.on('updateTime', ({ timeRemaining: serverTime }) => {
    timeRemaining = serverTime;
    updateTimerDisplay();
  });

  socket.on('gameOver', ({ winnerId, reason }) => {
    const isWinner = winnerId === socket.id;
    let msg = isWinner ? `🏆 목표 점수를 먼저 달성했습니다!` : (winnerId ? `💀 다른 플레이어가 먼저 달성했습니다.` : `⏰ ${reason}`);
    endGame(isWinner, msg);
  });

  function buildBoardElements() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';

    // 30열 / 50열 규격에 맞춰 24px 타일 / 11px 폰트 자동 적용
    const tileSize = currentConfig.cols >= 30 ? 24 : 30;
    const fontSize = currentConfig.cols >= 30 ? 11 : 13;

    boardEl.style.gridTemplateColumns = `repeat(${currentConfig.cols}, ${tileSize}px)`;
    boardEl.style.gridTemplateRows = `repeat(${currentConfig.rows}, ${tileSize}px)`;

    for (let r = 0; r < currentConfig.rows; r++) {
      for (let c = 0; c < currentConfig.cols; c++) {
        const tile = document.createElement('div');
        tile.id = `tile-${r}-${c}`;
        tile.style.width = `${tileSize}px`;
        tile.style.height = `${tileSize}px`;
        tile.style.fontSize = `${fontSize}px`;
        tile.addEventListener('click', () => handleTileClick(r, c));
        boardEl.appendChild(tile);
      }
    }
  }

  function renderBoard() {
    clearHintHighlights();
    for (let r = 0; r < currentConfig.rows; r++) {
      for (let c = 0; c < currentConfig.cols; c++) {
        const tile = document.getElementById(`tile-${r}-${c}`);
        if (!tile) continue;
        const colorIdx = board[r][c];

        if (colorIdx === -1) {
          tile.className = 'tile empty';
          tile.style.background = '';
          tile.innerText = '';
        } else {
          tile.className = 'tile';
          const colorObj = activeColors[colorIdx] || { background: '#333', textColor: '#fff' };
          tile.style.background = colorObj.background;
          tile.style.color = colorObj.textColor;
          tile.innerText = showIcons ? SYMBOLS[colorIdx % SYMBOLS.length] : '';
        }
      }
    }
  }

  function handleTileClick(r, c) {
    if (board[r][c] !== -1 || timeRemaining <= 0) return;
    socket.emit('clickTile', { roomId: currentRoomId, r, c });
  }

  function updateTimerDisplay() {
    const hours = Math.floor(timeRemaining / 3600);
    const minutes = Math.floor((timeRemaining % 3600) / 60);
    const seconds = timeRemaining % 60;

    let timeStr = "";
    if (hours > 0) {
      timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    } else {
      timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }
    
    const timerEl = document.getElementById('timer');
    timerEl.innerText = timeStr;

    if (timeRemaining <= 10) {
      timerEl.classList.add('time-warning');
    } else {
      timerEl.classList.remove('time-warning');
    }
  }

  function endGame(isVictory, message) {
    clearInterval(hintTimer);
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalLeaderboard = document.getElementById('modal-leaderboard');

    modalTitle.innerText = isVictory ? "🏆 승리!" : "💀 게임 종료";
    modalTitle.style.color = isVictory ? "#58a6ff" : "#f85149";
    modalDesc.innerText = message;

    modalLeaderboard.innerHTML = '';
    const sorted = Object.keys(lastScores).map(id => ({
      id,
      nickname: lastScores[id].nickname,
      score: lastScores[id].score
    })).sort((a, b) => b.score - a.score);

    sorted.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = `modal-row ${idx === 0 ? 'rank-1' : ''}`;
      row.innerHTML = `
        <span>${idx + 1}위: ${p.nickname} ${p.id === socket.id ? '(나)' : ''}</span>
        <span><strong>${p.score}점</strong></span>
      `;
      modalLeaderboard.appendChild(row);
    });

    modal.classList.add('active');
  }
</script>
</body>
</html>
