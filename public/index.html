<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>컬러타일 천후 개조</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 98vw;
      max-width: 1400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 로비 뷰 */
    #lobby-view {
      background: #1e1e1e;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    #lobby-view h1 {
      text-align: center;
      color: #4facfe;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .form-group label {
      font-size: 0.9rem;
      color: #aaa;
    }
    .form-group input, .form-group select {
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
    }
    .btn {
      padding: 1rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #fff;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:active {
      transform: scale(0.98);
    }

    /* 게임 뷰 */
    #game-view {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      padding: 0.8rem 1.5rem;
      border-radius: 12px;
    }
    .timer-box {
      font-size: 1.2rem;
      font-weight: bold;
      color: #00f2fe;
    }
    .scores-box {
      display: flex;
      gap: 1.5rem;
      font-size: 1rem;
    }
    .score-item {
      display: flex;
      gap: 0.5rem;
    }

    /* 그리드 및 타일 반응형 비율 적용 */
    .board-container {
      position: relative;
      background: #181818;
      padding: 12px;
      border-radius: 12px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    #board {
      display: grid;
      gap: 2px;
      background: #252525;
      padding: 4px;
      border-radius: 6px;
    }

    .tile {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s, border 0.1s;
    }
    .tile.empty {
      background-color: transparent !important;
      cursor: default;
    }
    .tile.hint {
      border: 3px solid #ffff00 !important;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.95); }
      to { transform: scale(1.05); }
    }

    /* 동적 셀 크기 조정 */
    @media (max-width: 1650px) {
      .board-container { padding: 6px; }
      #board { gap: 1px; }
    }

    /* 모달 */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #222;
      padding: 2rem;
      border-radius: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 400px;
      width: 90%;
    }
    .hidden { display: none !important; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div class="container">
    <!-- 로비 뷰 -->
    <div id="lobby-view">
      <h1>컬러타일 천후 개조</h1>
      <div class="form-group">
        <label for="nickname">닉네임</label>
        <input type="text" id="nickname" value="플레이어1" placeholder="닉네임 입력">
      </div>
      <div class="form-group">
        <label for="room-id">방 번호 / 이름</label>
        <input type="text" id="room-id" value="room1" placeholder="방 이름 입력">
      </div>
      <div class="form-group">
        <label for="mode">난이도 모드</label>
        <select id="mode">
          <option value="hard" selected>하드 모드 (25x40 / 500점)</option>
          <option value="normal">노멀 모드 (12x22 / 200점)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="time-limit">제한 시간</label>
        <select id="time-limit">
          <option value="60">1분</option>
          <option value="120">2분</option>
          <option value="180" selected>3분</option>
          <option value="300">5분</option>
          <option value="86400">무제한</option>
        </select>
      </div>
      <div class="form-group">
        <label for="color-count">타일 색상 종류 수</label>
        <select id="color-count">
          <option value="12">12개</option>
          <option value="16" selected>16개</option>
          <option value="20">20개</option>
          <option value="24">24개</option>
          <option value="32">32개</option>
        </select>
      </div>
      <button class="btn" id="btn-join">게임 입장하기</button>
    </div>

    <!-- 게임 뷰 -->
    <div id="game-view" class="hidden">
      <div class="top-bar">
        <div class="timer-box" id="timer-display">시간: --:--</div>
        <div class="scores-box" id="scores-display"></div>
        <button class="btn" id="btn-hint" style="padding: 0.5rem 1rem; font-size: 0.9rem;">힌트 받기</button>
      </div>

      <div class="board-container">
        <div id="board"></div>
      </div>
    </div>
  </div>

  <!-- 결과 모달 -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">게임 종료</h2>
      <p id="modal-message"></p>
      <button class="btn" onclick="location.reload()">로비로 돌아가기</button>
    </div>
  </div>

  <script>
    const socket = io();

    let board = [];
    let currentConfig = { rows: 25, cols: 40, targetTileCount: 500, winScore: 500 };
    let activeColors = [];
    let currentRoomId = '';
    let hintTimeout = null;

    // 눈이 편한 색상 생성기
    function generateEyeFriendlyColors(count) {
      const colors = [];
      for (let i = 0; i < count; i++) {
        const hue = (i * 360 / count) % 360;
        colors.push(`hsl(${hue}, 70%, 55%)`);
      }
      return colors;
    }

    // Web Audio API 오디오 효과음
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playCorrectSound() { playBeep(587.33, 'triangle', 0.15); }
    function playShuffleSound() { playBeep(220, 'sawtooth', 0.2); }

    // HTML DOM 그리드 빌드 (상대 비율 적용)
    function buildBoardElements() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      // CSS 반응형 1fr 할당
      boardEl.style.gridTemplateColumns = `repeat(${currentConfig.cols}, 1fr)`;
      boardEl.style.gridTemplateRows = `repeat(${currentConfig.rows}, 1fr)`;

      const containerWidth = Math.min(window.innerWidth * 0.95, 1300);
      const tileSize = Math.max(12, Math.floor(containerWidth / currentConfig.cols));
      boardEl.style.width = `${tileSize * currentConfig.cols}px`;

      for (let r = 0; r < currentConfig.rows; r++) {
        for (let c = 0; c < currentConfig.cols; c++) {
          const tile = document.createElement('div');
          tile.id = `tile-${r}-${c}`;
          tile.className = 'tile';
          tile.style.height = `${tileSize}px`;
          tile.addEventListener('click', () => handleTileClick(r, c));
          boardEl.appendChild(tile);
        }
      }
    }

    function renderBoard() {
      for (let r = 0; r < currentConfig.rows; r++) {
        for (let c = 0; c < currentConfig.cols; c++) {
          const tileEl = document.getElementById(`tile-${r}-${c}`);
          if (!tileEl) continue;

          const colorIdx = board[r][c];
          tileEl.classList.remove('hint');

          if (colorIdx === -1) {
            tileEl.className = 'tile empty';
            tileEl.style.backgroundColor = 'transparent';
          } else {
            tileEl.className = 'tile';
            tileEl.style.backgroundColor = activeColors[colorIdx] || '#888';
          }
        }
      }
    }

    function handleTileClick(r, c) {
      if (board[r][c] !== -1) return; // 빈칸만 클릭 가능
      socket.emit('clickTile', { roomId: currentRoomId, r, c });
    }

    document.getElementById('btn-join').addEventListener('click', () => {
      const nickname = document.getElementById('nickname').value;
      const roomId = document.getElementById('room-id').value;
      const mode = document.getElementById('mode').value;
      const colorCount = parseInt(document.getElementById('color-count').value, 10);
      const timeLimit = parseInt(document.getElementById('time-limit').value, 10);

      currentRoomId = roomId;
      socket.emit('joinRoom', { roomId, colorCount, timeLimit, nickname, mode });
    });

    document.getElementById('btn-hint').addEventListener('click', () => {
      socket.emit('getHint', { roomId: currentRoomId });
    });

    // 소켓 이벤트 수신
    socket.on('initMyBoard', ({ board: myBoard, timeRemaining, config }) => {
      board = myBoard;
      currentConfig = config;
      
      const count = config?.colorCount || parseInt(document.getElementById('color-count').value, 10) || 16;
      activeColors = config?.colors || generateEyeFriendlyColors(count);

      document.getElementById('lobby-view').classList.add('hidden');
      document.getElementById('game-view').classList.remove('hidden');

      buildBoardElements();
      renderBoard();
    });

    socket.on('updateMyBoard', ({ board: newBoard, hit, shuffled }) => {
      board = newBoard;
      renderBoard();

      if (hit) playCorrectSound();
      if (shuffled) playShuffleSound();
    });

    socket.on('updateScores', ({ scores, winScore }) => {
      const scoresEl = document.getElementById('scores-display');
      scoresEl.innerHTML = '';

      for (const id in scores) {
        const item = document.createElement('div');
        item.className = 'score-item';
        item.innerHTML = `<span>${scores[id].nickname}:</span> <strong>${scores[id].score} / ${winScore}</strong>`;
        scoresEl.appendChild(item);
      }
    });

    socket.on('updateTime', ({ timeRemaining }) => {
      if (timeRemaining >= 86000) {
        document.getElementById('timer-display').innerText = '시간: 무제한';
        return;
      }
      const mins = Math.floor(timeRemaining / 60);
      const secs = timeRemaining % 60;
      document.getElementById('timer-display').innerText = 
        `시간: ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    });

    socket.on('receiveHint', (pos) => {
      if (!pos) return;
      const tileEl = document.getElementById(`tile-${pos.r}-${pos.c}`);
      if (tileEl) {
        tileEl.classList.add('hint');
        if (hintTimeout) clearTimeout(hintTimeout);
        hintTimeout = setTimeout(() => {
          tileEl.classList.remove('hint');
        }, 2000);
      }
    });

    socket.on('gameOver', ({ winnerId, reason }) => {
      document.getElementById('modal-title').innerText = '게임 종료';
      document.getElementById('modal-message').innerText = reason;
      document.getElementById('modal').classList.remove('hidden');
    });
  </script>
</body>
</html>
