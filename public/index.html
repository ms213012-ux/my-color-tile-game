<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Tile - 천후개조 컬러타일</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background-color: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .hidden { display: none !important; }

    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #94a3b8; }
    input, select {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 1rem;
    }

    .btn {
      width: 100%; padding: 14px; border-radius: 8px; border: none;
      background-color: #0284c7; color: white; font-size: 1rem; font-weight: bold;
      cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background-color: #0369a1; }
    .btn-secondary { background-color: #475569; }
    .btn-secondary:hover { background-color: #334155; }

    .game-layout {
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .game-layout { grid-template-columns: 1fr; }
    }

    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      background-color: #0f172a; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px;
    }

    #board {
      display: grid; gap: 2px; background-color: #334155;
      padding: 6px; border-radius: 8px; width: 100%; aspect-ratio: 4 / 3;
    }

    .tile {
      width: 100%; height: 100%; border-radius: 3px; cursor: pointer;
      transition: transform 0.05s, opacity 0.2s;
    }
    .tile:hover { transform: scale(1.08); z-index: 2; }
    .tile.empty {
      background-color: #1e293b !important;
      border: 1px dashed #334155;
    }
    .tile.hint-target {
      animation: hintPulse 0.8s infinite alternate;
      border: 2px solid #f59e0b !important;
    }

    @keyframes hintPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(245, 158, 11, 0.8); }
      100% { transform: scale(1.15); box-shadow: 0 0 10px rgba(245, 158, 11, 1); }
    }

    .scoreboard {
      background-color: #0f172a;
      padding: 16px;
      border-radius: 8px;
    }
    .scoreboard h3 { margin-bottom: 12px; color: #38bdf8; font-size: 1.1rem; }
    .player-rank {
      display: flex; justify-content: space-between; padding: 8px 0;
      border-bottom: 1px solid #1e293b; font-size: 0.95rem;
    }
    .player-rank.me { color: #f59e0b; font-weight: bold; }

    .controls { display: flex; gap: 10px; margin-top: 16px; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75); display: flex; justify-content: center; align-items: center; z-index: 10;
    }
    .modal-content {
      background-color: #1e293b; padding: 30px; border-radius: 12px; text-align: center;
      max-width: 400px; width: 90%;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚔️ Color Tile 멀티 대전</h1>

    <!-- 로비 -->
    <div id="lobby-view">
      <div class="form-group">
        <label for="player-name">닉네임</label>
        <input type="text" id="player-name" placeholder="닉네임을 입력하세요">
      </div>
      <div class="form-group">
        <label for="room-id">방 이름</label>
        <input type="text" id="room-id" value="battle-room">
      </div>
      <div class="form-group">
        <label for="target-score">승리 목표 점수</label>
        <select id="target-score">
          <option value="200" selected>200점 먼저 달성</option>
          <option value="500">500점 먼저 달성</option>
        </select>
      </div>
      <div class="form-group">
        <label for="color-count">색상 수</label>
        <select id="color-count">
          <option value="6">6개 (쉬움)</option>
          <option value="8" selected>8개 (보통)</option>
          <option value="12">12개 (어려움)</option>
        </select>
      </div>
      <button class="btn" id="join-btn">대전 방 참가하기</button>
    </div>

    <!-- 게임 화면 -->
    <div id="game-view" class="hidden">
      <div class="status-bar">
        <span>⏱️ 남은 시간: <strong id="time-display">120</strong>s</span>
        <span>🎯 목표 점수: <strong id="target-score-display">200</strong>점</span>
      </div>

      <div class="game-layout">
        <div>
          <div id="board"></div>
          <div class="controls">
            <button class="btn btn-secondary" id="hint-btn">💡 힌트</button>
            <button class="btn" id="leave-btn">나가기</button>
          </div>
        </div>

        <!-- 실시간 점수판 -->
        <div class="scoreboard">
          <h3>🏆 플레이어 순위</h3>
          <div id="player-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 모달 -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h2 id="modal-title" style="margin-bottom:12px; color:#38bdf8;">결과</h2>
      <p id="modal-message" style="margin-bottom:20px; color:#cbd5e1; white-space: pre-line;"></p>
      <button class="btn" id="modal-close-btn">확인</button>
    </div>
  </div>

  <script>
    const socket = io();

    let board = [];
    let activeColors = [];
    let myScore = 0;
    let hintTimeout = null;

    function generateEyeFriendlyColors(count) {
      const colors = [];
      const hueStep = 360 / count;
      for (let i = 0; i < count; i++) {
        colors.push(`hsl(${Math.round(i * hueStep)}, 75%, 55%)`);
      }
      return colors;
    }

    document.getElementById('join-btn').addEventListener('click', () => {
      const playerName = document.getElementById('player-name').value;
      const roomId = document.getElementById('room-id').value;
      const targetScore = parseInt(document.getElementById('target-score').value);
      const colorCount = parseInt(document.getElementById('color-count').value);

      socket.emit('joinRoom', {
        roomId,
        playerName,
        targetScore,
        colorCount,
        width: 16,
        height: 12,
        timeLimit: 180
      });
    });

    socket.on('initMyBoard', ({ board: myBoard, targetScore, timeRemaining, colorCount }) => {
      board = myBoard;
      myScore = 0;

      activeColors = generateEyeFriendlyColors(colorCount);

      document.getElementById('target-score-display').innerText = targetScore;
      document.getElementById('time-display').innerText = timeRemaining;

      document.getElementById('lobby-view').classList.add('hidden');
      document.getElementById('game-view').classList.remove('hidden');
      document.getElementById('modal').classList.add('hidden');

      buildBoardGrid();
      renderBoard();
    });

    function buildBoardGrid() {
      const boardElement = document.getElementById('board');
      boardElement.innerHTML = '';
      const height = board.length;
      const width = board[0].length;

      boardElement.style.gridTemplateColumns = `repeat(${width}, 1fr)`;
      boardElement.style.gridTemplateRows = `repeat(${height}, 1fr)`;

      for (let r = 0; r < height; r++) {
        for (let c = 0; c < width; c++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.dataset.row = r;
          tile.dataset.col = c;

          tile.addEventListener('click', () => {
            clearHint();
            socket.emit('clickTile', { r, c });
          });

          boardElement.appendChild(tile);
        }
      }
    }

    function renderBoard() {
      const tiles = document.querySelectorAll('#board .tile');
      tiles.forEach(tile => {
        const r = parseInt(tile.dataset.row);
        const c = parseInt(tile.dataset.col);
        const colorIdx = board[r][c];

        if (colorIdx === null) {
          tile.className = 'tile empty';
          tile.style.backgroundColor = '';
        } else {
          tile.className = 'tile';
          tile.style.backgroundColor = activeColors[colorIdx] || '#000';
        }
      });
    }

    socket.on('updateBoard', ({ board: updatedBoard, score: updatedScore }) => {
      board = updatedBoard;
      myScore = updatedScore;
      renderBoard();
    });

    socket.on('timeUpdate', ({ timeRemaining }) => {
      document.getElementById('time-display').innerText = timeRemaining;
    });

    socket.on('roomStatusUpdate', ({ players, targetScore }) => {
      const listElement = document.getElementById('player-list');
      listElement.innerHTML = '';

      // 점수 순 내림차순 정렬
      players.sort((a, b) => b.score - a.score);

      players.forEach(p => {
        const item = document.createElement('div');
        const isMe = p.id === socket.id;
        item.className = `player-rank ${isMe ? 'me' : ''}`;
        item.innerHTML = `
          <span>${p.name}${isMe ? ' (나)' : ''}</span>
          <span>${p.score} / ${targetScore}점</span>
        `;
        listElement.appendChild(item);
      });
    });

    // 힌트
    document.getElementById('hint-btn').addEventListener('click', () => {
      socket.emit('requestHint');
    });

    socket.on('receiveHint', ({ hintPos }) => {
      clearHint();
      if (hintPos) {
        const target = document.querySelector(`.tile[data-row="${hintPos.r}"][data-col="${hintPos.c}"]`);
        if (target) {
          target.classList.add('hint-target');
          hintTimeout = setTimeout(clearHint, 3000);
        }
      }
    });

    function clearHint() {
      if (hintTimeout) clearTimeout(hintTimeout);
      document.querySelectorAll('.tile').forEach(t => t.classList.remove('hint-target'));
    }

    // 승리/종료 모달
    socket.on('matchEnded', ({ winnerName, winnerScore, reason }) => {
      showModal('🏆 경기 종료', `우승자: ${winnerName} (${winnerScore}점)\n${reason}`);
    });

    function showModal(title, message) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-message').innerText = message;
      document.getElementById('modal').classList.remove('hidden');
    }

    document.getElementById('modal-close-btn').addEventListener('click', () => {
      document.getElementById('modal').classList.add('hidden');
    });

    document.getElementById('leave-btn').addEventListener('click', () => {
      location.reload();
    });
  </script>
</body>
</html>
